<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Parroto</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body{margin:10px;font-family:Arial}
    #player{width:100%;aspect-ratio:16/9;background:#000}
    input{width:100%;padding:6px;margin:6px 0}
    button{margin:6px 8px 6px 0;padding:6px 12px}
    #text{background:#fff;border:1px solid #ccc;padding:12px;min-height:60px;white-space:pre-wrap}
  </style>
</head>
<body style="margin:10px; font-family:Arial;">



<div style="display:flex; gap:20px; flex-wrap:wrap;">

  <!-- Левая колонка: плеер -->
  <div style="flex:1; min-width:320px;">
    <div style="display:flex; gap:8px; margin-bottom:20px;">
      <input id="subsUrl" placeholder="URL timedtext https://www.youtube.com/api/timedtext..." style="flex:1; padding:6px;">
      <button onclick="loadSubs()">Load</button>
    </div>
    <div id="player" style="width:100%; aspect-ratio:16/9; background:#000;"></div>
  </div>

  <!-- Правая колонка: субтитры + чекбокс + кнопки + info -->
  <div style="flex:1; min-width:320px; display:flex; flex-direction:column; gap:12px;">

    <div id="text" style="background:#fff; border:1px solid #ccc; padding:12px; min-height:80px; white-space:pre-wrap;">
      субтитры не загружены
    </div>

    <div style="display:flex; flex-wrap:wrap; gap:12px;">
      <button onclick="prev()">←</button>
      <button onclick="playNow()">▶</button>
      <button onclick="next()">→</button>
      <span id="info" style="font-weight:bold; margin-left:10px;"></span>
    </div>

  </div>

</div>

<script>
let player, chunks = [], idx = 0, tmr;

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    playerVars: { playsinline:1, enablejsapi:1, rel:0 }
  });
};

function loadSubs() {
  const url = document.getElementById('subsUrl').value.trim();
  if (url) loadFromUrl(url);
}

function loadFromUrl(url) {
  const p = new URLSearchParams(new URL(url).search);
  const vid = p.get('v');
  if (vid) {
    player.cueVideoById(vid);
  }

  fetch(url)
    .then(r => r.json())
    .then(data => parse(data))
    .catch(e => alert('Ошибка загрузки: ' + e.message));
}

function parse(data) {
  const words = [];
  (data.events || []).forEach(e => {
    if (!e.tStartMs || !e.segs) return;
    const base = e.tStartMs;
    e.segs.forEach(s => {
      if (!s.utf8?.trim() || s.utf8 === '\n' || /^\[.*\]$/.test(s.utf8.trim())) return;
      const time = base + (s.tOffsetMs || 0);
      words.push({text: s.utf8.trim(), time});
    });
  });

  if (!words.length) return;

  chunks = [];
  let curText = words[0].text;
  let curStart = words[0].time / 1000 - 0.5;

  for (let j = 1; j < words.length; j++) {
    curText += ' ' + words[j].text;
    if (words[j].text.endsWith('.')) {
      const end = words[j].time / 1000 + 0.5;
      chunks.push({start: curStart, end, text: curText.trim()});
      curText = '';
      curStart = (j + 1 < words.length) ? words[j + 1].time / 1000 : end;
    }
  }

  if (curText.trim()) {
    chunks.push({
      start: curStart,
      end: (words[words.length - 1].time / 1000) + 1.2,
      text: curText.trim()
    });
  }

  idx = 0;
  show();
}

function show() {
  if (!chunks.length) return;
  const c = chunks[idx];
  document.getElementById('text').textContent = c.text;
  document.getElementById('info').textContent = 
    `${idx+1}/${chunks.length} [${c.start.toFixed(1)}–${c.end.toFixed(1)}]`;
}

function playNow() {
  if (!chunks.length || !player) return;
  const c = chunks[idx];
  player.pauseVideo();
  player.seekTo(c.start, true);
  setTimeout(() => {
    player.playVideo();
    clearInterval(tmr);
    tmr = setInterval(() => {
      if (player.getCurrentTime() >= c.end - 0.1) {
        player.pauseVideo();
        clearInterval(tmr);
      }
    }, 60);
  }, 400);
}

function next() {
  if (idx + 1 < chunks.length) { idx++; show(); playNow(); } 
}
  
function prev() { 
  if (idx > 0) { idx--; show(); playNow(); } 
}
</script>
</body>
</html>
