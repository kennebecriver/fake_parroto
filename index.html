<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чанки — yVnlvaxFQ6E (исправленные метки)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin:0; padding:20px; background:#f9f9f9; line-height:1.4; max-width:900px; margin:0 auto; }
    #player-wrap { position:relative; width:100%; aspect-ratio:16/9; max-width:720px; background:#000; margin:0 auto 20px; }
    iframe { width:100%; height:100%; border:none; }
    textarea { width:100%; height:180px; font-family:monospace; font-size:13px; padding:10px; margin:10px 0; }
    .buttons { margin:15px 0; display:flex; gap:12px; flex-wrap:wrap; }
    button { padding:10px 20px; font-size:15px; cursor:pointer; }
    #current-text { background:white; border:1px solid #ddd; padding:18px; min-height:100px; margin:15px 0; white-space:pre-wrap; font-size:17px; }
    #status { background:#e8ffe8; border:1px solid #b0ffb0; padding:12px; font-family:monospace; font-size:13px; white-space:pre-wrap; margin:15px 0; min-height:140px; color:#003300; overflow-y:auto; }
  </style>
</head>
<body>

<h2>Видео: yVnlvaxFQ6E + чанки субтитров</h2>

<div id="player-wrap">
  <iframe id="ytplayer" src="https://www.youtube.com/embed/yVnlvaxFQ6E?enablejsapi=1&rel=0&iv_load_policy=3&playsinline=1&origin=" + encodeURIComponent(window.location.origin)" frameborder="0" allowfullscreen></iframe>
</div>

<strong>Вставь JSON субтитров (json3):</strong><br>
<textarea id="jsonInput"></textarea>

<div class="buttons">
  <button onclick="parseChunks()">Разбить на чанки</button>
</div>

<div id="current-text">Субтитры не загружены</div>

<div class="buttons">
  <button onclick="prev()">← Назад</button>
  <button onclick="playNow()">▶ Играть чанк</button>
  <button onclick="next()">Вперёд →</button>
  <span id="info" style="margin-left:20px; font-weight:bold;"></span>
</div>

<div id="status">Статус...</div>

<script>
let chunks = [];
let currentIdx = 0;
const iframe = document.getElementById('ytplayer');
let activeTimer = null;

function log(txt) {
  document.getElementById('status').textContent += txt + '\n';
  document.getElementById('status').scrollTop = document.getElementById('status').scrollHeight;
}

function sendCommand(func, args = []) {
  iframe.contentWindow.postMessage(JSON.stringify({
    event: 'command',
    func: func,
    args: args
  }), '*');
}

function parseChunks() {
  const text = document.getElementById('jsonInput').value.trim();
  if (!text) return alert('Вставь JSON');

  let data;
  try { data = JSON.parse(text); } catch (e) { log('Ошибка JSON: ' + e.message); return; }

  chunks = [];
  let current = null;

  (data.events || []).forEach(ev => {
    if (typeof ev.tStartMs !== 'number') return;

    const start = ev.tStartMs / 1000;
    const dur = (ev.dDurationMs || 0) / 1000;
    const end = start + dur;

    const isNewLine = ev.segs?.length === 1 && ev.segs[0].utf8 === '\n';

    if (isNewLine) {
      // Просто завершаем текущий чанк (если он существует и имеет текст)
      if (current && current.text.trim()) {
        chunks.push(current);
      }
      current = null; // ждём следующего текста
      return;
    }

    // Пропускаем не-текст (Applause и т.п.)
    let segText = ev.segs?.map(s => s.utf8 || '').join('').trim() || '';
    if (!segText || segText === '[Applause]') return;

    // Создаём новый чанк или продолжаем существующий
    if (!current) {
      current = {
        start: start,
        end: end,
        text: segText
      };
    } else {
      current.text += ' ' + segText;
      current.end = Math.max(current.end, end); // обновляем конец
    }
  });

  // Добавляем последний чанк, если он остался
  if (current && current.text.trim()) {
    chunks.push(current);
  }

  // Финальная фильтрация (защита от ошибок)
  chunks = chunks.filter(c => c.end > c.start + 0.1); // минимум 100 мс

  currentIdx = 0;
  log(`Создано чанков: ${chunks.length}`);
  chunks.forEach((c, i) => {
    log(`  #${i+1}: [${c.start.toFixed(2)} → ${c.end.toFixed(2)}]  "${c.text.substring(0, 50)}..."`);
  });

  updateDisplay();
}

function updateDisplay() {
  if (chunks.length === 0) {
    document.getElementById('current-text').textContent = 'Нет чанков или ошибка парсинга';
    document.getElementById('info').textContent = '';
    return;
  }
  const c = chunks[currentIdx];
  document.getElementById('current-text').textContent = c.text.trim();
  document.getElementById('info').textContent = `Чанк ${currentIdx+1}/${chunks.length}   [${c.start.toFixed(2)}–${c.end.toFixed(2)}с]`;
}

function playNow() {
  if (chunks.length === 0) return alert('Сначала разбейте субтитры');

  const c = chunks[currentIdx];

  if (activeTimer) clearTimeout(activeTimer);

  log(`Запуск чанка ${currentIdx+1} [${c.start.toFixed(2)} → ${c.end.toFixed(2)}]`);

  sendCommand('seekTo', [c.start, true]);

  setTimeout(() => {
    sendCommand('pauseVideo'); // сброс состояния

    setTimeout(() => {
      sendCommand('playVideo');
      log(' → playVideo');

      setTimeout(() => sendCommand('playVideo'), 600); // повтор для надёжности

      // Длительность + запас на задержку
      const durationMs = Math.max(800, (c.end - c.start) * 1000 + 1200);
      activeTimer = setTimeout(() => {
        sendCommand('pauseVideo');
        log(' → остановка чанка');
      }, durationMs);
    }, 700);
  }, 1800); // задержка после seek — самая критичная
}

function next() {
  if (currentIdx + 1 >= chunks.length) return alert('Конец');
  currentIdx++;
  updateDisplay();
  playNow();
}

function prev() {
  if (currentIdx <= 0) return alert('Начало');
  currentIdx--;
  updateDisplay();
  playNow();
}
</script>

</body>
</html>
