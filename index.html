<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чанки — yVnlvaxFQ6E</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin:0; padding:20px; background:#f9f9f9; line-height:1.4; max-width:840px; margin:0 auto; }
    #player-wrap { position:relative; width:100%; aspect-ratio:16/9; max-width:720px; background:#000; margin:0 auto 20px; }
    #player { width:100%; height:100%; }
    textarea { width:100%; height:160px; font-family:monospace; font-size:13px; padding:10px; margin:10px 0; box-sizing:border-box; }
    .buttons { margin:15px 0; display:flex; gap:12px; flex-wrap:wrap; }
    button { padding:10px 20px; font-size:15px; cursor:pointer; }
    #current-text { background:white; border:1px solid #ddd; padding:18px; min-height:100px; margin:15px 0; white-space:pre-wrap; font-size:17px; }
    #status { background:#fff8e1; border:1px solid #ffe082; padding:12px; font-family:monospace; font-size:13px; white-space:pre-wrap; margin:15px 0; min-height:100px; color:#5d4037; overflow-y:auto; }
  </style>
</head>
<body>

<h2>Видео: yVnlvaxFQ6E + чанки субтитров</h2>

<div id="player-wrap"><div id="player"></div></div>

<strong>Вставь JSON субтитров (json3):</strong><br>
<textarea id="jsonInput"></textarea>

<div class="buttons">
  <button onclick="parseChunks()">Разбить на чанки</button>
</div>

<div id="current-text">Субтитры не загружены</div>

<div class="buttons">
  <button onclick="prev()">← Назад</button>
  <button onclick="playNow()">▶ Играть чанк</button>
  <button onclick="next()">Вперёд →</button>
  <span id="info" style="margin-left:20px; font-weight:bold;"></span>
</div>

<div id="status">Статус плеера и лога...</div>

<script>
let player;
let chunks = [];
let idx = 0;
let timer = null;

function log(txt) {
  document.getElementById('status').textContent += txt + '\n';
  document.getElementById('status').scrollTop = document.getElementById('status').scrollHeight;
}

window.onYouTubeIframeAPIReady = () => {
  log('API загружен');
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    videoId: 'yVnlvaxFQ6E',
    playerVars: {
      playsinline: 1,
      enablejsapi: 1,
      origin: window.location.origin,
      rel: 0,
      iv_load_policy: 3
    },
    events: {
      'onReady': () => {
        log('Плеер готов — можно управлять');
        player.setPlaybackQuality('small');
      },
      'onStateChange': e => log(`Состояние: ${e.data}`),
      'onError': e => log(`Ошибка плеера: ${e.data}`)
    }
  });
};

function parseChunks() {
  const raw = document.getElementById('jsonInput').value.trim();
  if (!raw) return alert('Вставь JSON');

  let data;
  try { data = JSON.parse(raw); }
  catch (e) { log('Ошибка JSON: ' + e.message); return; }

  chunks = [];
  let currentText = '';
  let currentStart = 0;
  let currentEnd = 0;
  let hasStarted = false;

  const events = data.events || [];
  events.forEach((ev, i) => {
    if (typeof ev.tStartMs !== 'number') return;

    const startMs = ev.tStartMs;
    const durationMs = ev.dDurationMs || 0;
    const endMs = startMs + durationMs;

    // Проверяем, является ли это событием новой строки
    const isNewLine = ev.aAppend === 1 && ev.segs && ev.segs.length === 1 && ev.segs[0].utf8 === '\n';

    if (isNewLine) {
      // Завершаем текущий чанк, если в нём есть текст
      if (currentText.trim()) {
        chunks.push({
          start: currentStart / 1000,
          end: startMs / 1000,  // конец чанка на моменте появления \n
          text: currentText.trim()
        });
        log(`Создан чанк ${chunks.length}: [${(currentStart / 1000).toFixed(2)} - ${(startMs / 1000).toFixed(2)}] "${currentText.trim().substring(0, 50)}..."`);
      }
      // Начинаем новый чанк после \n
      currentText = '';
      currentStart = endMs;  // начало следующего после длительности \n события
      currentEnd = 0;
      hasStarted = false;
      return;
    }

    // Проверяем на специальные события вроде [Applause]
    if (ev.segs && ev.segs.length === 1 && ev.segs[0].utf8.startsWith('[') && ev.segs[0].utf8.endsWith(']')) {
      // Пропускаем [Applause] и подобные, не добавляем в текст
      return;
    }

    // Обычное текстовое событие
    let segText = '';
    if (ev.segs) {
      segText = ev.segs.map(s => s.utf8 || '').join('').trim();
    }

    if (segText) {
      if (currentText) currentText += ' ';
      currentText += segText;
      currentEnd = endMs;

      // Если это первое текстовое событие в чанке — устанавливаем start
      if (!hasStarted) {
        currentStart = startMs;
        hasStarted = true;
      }
    }
  });

  // Добавляем последний чанк, если есть текст
  if (currentText.trim()) {
    chunks.push({
      start: currentStart / 1000,
      end: currentEnd / 1000,
      text: currentText.trim()
    });
    log(`Создан чанк ${chunks.length}: [${(currentStart / 1000).toFixed(2)} - ${(currentEnd / 1000).toFixed(2)}] "${currentText.trim().substring(0, 50)}..."`);
  }

  idx = 0;
  log(`Всего чанков: ${chunks.length}`);
  showChunk();
}

function showChunk() {
  if (!chunks.length) return;
  const c = chunks[idx];
  document.getElementById('current-text').textContent = c.text.trim();
  document.getElementById('info').textContent = `Чанк ${idx+1}/${chunks.length}  [${c.start.toFixed(2)}–${c.end.toFixed(2)}с]`;
}

function playNow() {
  if (!chunks.length) return alert('Сначала разбей субтитры');
  if (!player) return log('Плеер ещё не готов');

  const c = chunks[idx];
  player.seekTo(c.start, true);

  setTimeout(() => {
    player.playVideo();
    log(`Старт чанка ${idx+1} с ${c.start.toFixed(2)}с`);

    if (timer) clearInterval(timer);
    timer = setInterval(() => {
      if (player.getCurrentTime() >= c.end - 0.1) {
        player.pauseVideo();
        clearInterval(timer);
        timer = null;
        log('Чанк остановлен');
      }
    }, 80);
  }, 500);
}

function next() {
  if (idx + 1 >= chunks.length) return alert('Конец');
  idx++;
  showChunk();
  playNow();
}

function prev() {
  if (idx <= 0) return alert('Начало');
  idx--;
  showChunk();
  playNow();
}
</script>

</body>
</html>
