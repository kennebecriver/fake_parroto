<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>чанки</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body{margin:10px;font-family:Arial}
    #player{width:100%;aspect-ratio:16/9;background:#000}
    textarea{width:100%;height:120px;font-family:monospace}
    button{margin:6px 8px 6px 0;padding:6px 12px}
    #text{background:#fff;border:1px solid #ccc;padding:12px;min-height:60px;white-space:pre-wrap}
  </style>
</head>
<body>

<div id="player"></div>
<textarea id="json" placeholder="вставь json3"></textarea>
<button onclick="parse()">Разбить</button>

<div id="text">субтитры не загружены</div>

<button onclick="prev()">←</button>
<button onclick="playNow()">▶</button>
<button onclick="next()">→</button>
<span id="info"></span>

<script>
let player, chunks = [], i = 0, tmr;

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    videoId: 'qibhr5vneEk',
    playerVars: { playsinline:1, enablejsapi:1, rel:0 }
  });
};

function parse() {
  const txt = document.getElementById('json').value.trim();
  if (!txt) return;
  
  let data;
  try { data = JSON.parse(txt); } catch { return; }

  // Собираем все слова с временем
  const words = [];
  (data.events || []).forEach(e => {
    if (!e.tStartMs || !e.segs) return;
    const base = e.tStartMs;
    e.segs.forEach(s => {
      if (!s.utf8?.trim() || s.utf8 === '\n' || /^\[.*\]$/.test(s.utf8.trim())) return;
      const time = base + (s.tOffsetMs || 0);
      words.push({text: s.utf8.trim(), time});
    });
  });

  if (!words.length) return;

  chunks = [];
  let curText = words[0].text;
  let curStart = words[0].time / 1000;

  for (let j = 1; j < words.length; j++) {
    curText += ' ' + words[j].text;

    // Если текущее слово заканчивается точкой — завершаем чанк
    if (words[j].text.endsWith('.')) {
      const chunkEnd = words[j].time / 1000 + 0.5; // небольшой запас после точки
      chunks.push({
        start: curStart,
        end: chunkEnd,
        text: curText.trim()
      });
      curText = '';
      curStart = (j + 1 < words.length) ? words[j + 1].time / 1000 : chunkEnd;
    }
  }

  // Добавляем остаток, если точка не нашлась в конце
  if (curText.trim()) {
    chunks.push({
      start: curStart,
      end: (words[words.length - 1].time / 1000) + 1.2,
      text: curText.trim()
    });
  }

  i = 0;
  show();
}

function show() {
  const c = chunks[i];
  document.getElementById('text').textContent = c.text;
  document.getElementById('info').textContent = `${i+1}/${chunks.length}  [${c.start.toFixed(1)}–${c.end.toFixed(1)}]`;
}

function playNow() {
  if (!chunks.length || !player) return;
  const c = chunks[i];
  player.pauseVideo();
  player.seekTo(c.start, true);
  setTimeout(() => {
    player.playVideo();
    clearInterval(tmr);
    tmr = setInterval(() => {
      if (player.getCurrentTime() >= c.end - 0.1) {
        player.pauseVideo();
        clearInterval(tmr);
      }
    }, 100);
  }, 500);
}

function next() { if (i + 1 < chunks.length) { i++; show(); playNow(); } }
function prev() { if (i > 0) { i--; show(); playNow(); } }
</script>
</body>
</html>
