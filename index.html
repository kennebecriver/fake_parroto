<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чанки — yVnlvaxFQ6E</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin:0; padding:20px; background:#f9f9f9; line-height:1.4; max-width:840px; margin:0 auto; }
    #player-wrap { position:relative; width:100%; aspect-ratio:16/9; max-width:320px; background:#000; margin:0 auto 20px; }
    #player { width:100%; height:100%; }
    textarea { width:100%; height:160px; font-family:monospace; font-size:13px; padding:10px; margin:10px 0; box-sizing:border-box; }
    .buttons { margin:15px 0; display:flex; gap:12px; flex-wrap:wrap; }
    button { padding:10px 20px; font-size:15px; cursor:pointer; }
    #current-text { background:white; border:1px solid #ddd; padding:18px; min-height:100px; margin:15px 0; white-space:pre-wrap; font-size:17px; }
    #status { background:#fff8e1; border:1px solid #ffe082; padding:12px; font-family:monospace; font-size:13px; white-space:pre-wrap; margin:15px 0; min-height:100px; color:#5d4037; overflow-y:auto; }
  </style>
</head>
<body>

<h2>Видео: yVnlvaxFQ6E + чанки субтитров</h2>

<div id="player-wrap"><div id="player"></div></div>

<strong>Вставь JSON субтитров (json3):</strong><br>
<textarea id="jsonInput"></textarea>

<div class="buttons">
  <button onclick="parseChunks()">Разбить на чанки</button>
</div>

<div id="current-text">Субтитры не загружены</div>

<div class="buttons">
  <button onclick="prev()">← Назад</button>
  <button onclick="playNow()">▶ Играть чанк</button>
  <button onclick="next()">Вперёд →</button>
  <span id="info" style="margin-left:20px; font-weight:bold;"></span>
</div>

<div id="status">Статус плеера и лога...</div>

<script>
let player;
let chunks = [];
let idx = 0;
let timer = null;

function log(txt) {
  document.getElementById('status').textContent += txt + '\n';
  document.getElementById('status').scrollTop = document.getElementById('status').scrollHeight;
}

window.onYouTubeIframeAPIReady = () => {
  log('API загружен');
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    videoId: 'yVnlvaxFQ6E',
    playerVars: {
      playsinline: 1,
      enablejsapi: 1,
      origin: window.location.origin,
      rel: 0,
      iv_load_policy: 3
    },
    events: {
      'onReady': () => {
        log('Плеер готов — можно управлять');
        player.setPlaybackQuality('small');
      },
      'onStateChange': e => log(`Состояние: ${e.data}`),
      'onError': e => log(`Ошибка плеера: ${e.data}`)
    }
  });
};

function parseChunks() {
  const raw = document.getElementById('jsonInput').value.trim();
  if (!raw) return alert('Вставь JSON');

  let data;
  try { data = JSON.parse(raw); }
  catch (e) { log('Ошибка JSON: ' + e.message); return; }

  chunks = [];
  let current = { start:0, end:0, text:'' };
  let has = false;

  (data.events || []).forEach(ev => {
    if (typeof ev.tStartMs !== 'number') return;

    const s = ev.tStartMs / 1000;
    const e = s + (ev.dDurationMs || 0) / 1000;

    if (ev.segs?.length === 1 && ev.segs[0].utf8 === '\n') {
      if (has && current.text.trim()) {
        current.end = s;
        chunks.push({ ...current });
      }
      current = { start: e, end: 0, text: '' };
      has = false;
      return;
    }

    let t = ev.segs?.map(s => s.utf8 || '').join('').trim() || '';
    if (t && t !== '[Applause]') {
      if (current.text) current.text += ' ';
      current.text += t;
      current.end = e;
      has = true;
      if (current.start === 0) current.start = s;
    }
  });

  if (has && current.text.trim()) chunks.push(current);

  idx = 0;
  log(`Чанков создано: ${chunks.length}`);
  showChunk();
}

function showChunk() {
  if (!chunks.length) return;
  const c = chunks[idx];
  document.getElementById('current-text').textContent = c.text.trim();
  document.getElementById('info').textContent = `Чанк ${idx+1}/${chunks.length}  [${c.start.toFixed(2)}–${c.end.toFixed(2)}с]`;
}

function playNow() {
  if (!chunks.length) return alert('Сначала разбей субтитры');
  if (!player) return log('Плеер ещё не готов');

  const c = chunks[idx];
  player.seekTo(c.start, true);

  setTimeout(() => {
    player.playVideo();
    log(`Старт чанка ${idx+1} с ${c.start.toFixed(2)}с`);

    if (timer) clearInterval(timer);
    timer = setInterval(() => {
      if (player.getCurrentTime() >= c.end - 0.1) {
        player.pauseVideo();
        clearInterval(timer);
        timer = null;
        log('Чанк остановлен');
      }
    }, 80);
  }, 500);
}

function next() {
  if (idx + 1 >= chunks.length) return alert('Конец');
  idx++;
  showChunk();
  playNow();
}

function prev() {
  if (idx <= 0) return alert('Начало');
  idx--;
  showChunk();
  playNow();
}
</script>

</body>
</html>
