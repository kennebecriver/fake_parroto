<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake Parroto</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    .secret-word {
      min-width: 2.2em;
      padding: 2px 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f8f9fa;
      cursor: pointer;
      user-select: none;
      font-family: monospace;
      transition: all 0.15s;
    }

    .secret-word.revealed,
    .secret-word.always-visible {
      background: #e3f2fd;
      border-color: #90caf9;
      cursor: default;
    }

    .secret-word:hover:not(.revealed):not(.always-visible) {
      background: #ffe082;
      border-color: #ffb300;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <header class="bg-white border-bottom py-2">
    <div class="container">
      <h1 class="h5 mb-0 text-muted">Fake Parroto</h1>
    </div>
  </header>

  <main class="flex-grow-1 py-4">
    <div class="container">
      <div class="row g-4">

        <!-- Левая колонка -->
        <div class="col-12 col-md-6 d-flex flex-column gap-3">
          <div id="player" class="ratio ratio-16x9 bg-black rounded"></div>

          <div class="d-flex gap-2">
            <input id="subsUrl" class="form-control form-control-sm" placeholder="URL timedtext...">
            <button onclick="loadSubs()" class="btn btn-primary btn-sm px-4">Load</button>
          </div>
        </div>

        <!-- Правая колонка -->
        <div class="col-12 col-md-6 d-flex flex-column gap-3">

          <textarea class="form-control form-control-sm" rows="4" placeholder="Type your answer here..."></textarea>
          
          <div id="hidden-words" class="border rounded p-3 small bg-white d-flex flex-wrap gap-2" style="min-height: 5rem; line-height: 2.1;"></div>

          <div id="text" class="border rounded p-3 small bg-white" style="min-height: 5rem;"></div>

          <!-- Единые минималистичные кнопки управления -->
          <div class="d-flex gap-3">
            <button onclick="prev()" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-skip-backward-fill"></i>
            </button>
            <button onclick="playNow()" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-play-fill"></i>
            </button>
            <button onclick="next()" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-skip-forward-fill"></i>
            </button>
          </div>

          <div class="small text-muted">
            <span id="info"></span>
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="border-top py-3 text-center text-muted small mt-auto">
   Fake Parroto © 2026
  </footer>

<script>
let player, chunks = [], idx = 0, tmr;

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    playerVars: { playsinline:1, enablejsapi:1, rel:0 }
  });
};

function loadSubs() {
  const url = document.getElementById('subsUrl').value.trim();
  if (url) loadFromUrl(url);
}

function loadFromUrl(url) {
  const p = new URLSearchParams(new URL(url).search);
  const vid = p.get('v');
  if (vid) {
    player.cueVideoById(vid);
  }

  fetch(url)
    .then(r => r.json())
    .then(data => parse(data))
    .catch(e => alert('Ошибка загрузки: ' + e.message));
}

function parse(data) {
  const words = [];
  (data.events || []).forEach(e => {
    if (!e.tStartMs || !e.segs) return;
    const base = e.tStartMs;
    e.segs.forEach(s => {
      if (!s.utf8?.trim() || s.utf8 === '\n' || /^\[.*\]$/.test(s.utf8.trim())) return;
      const time = base + (s.tOffsetMs || 0);
      words.push({text: s.utf8.trim(), time});
    });
  });

  if (!words.length) return;

  chunks = [];
  let curText = words[0].text;
  let curStart = words[0].time / 1000 - 0.5;

  for (let j = 1; j < words.length; j++) {
    curText += ' ' + words[j].text;
    if (words[j].text.endsWith('.')) {
      const end = words[j].time / 1000 + 0.5;
      chunks.push({start: curStart, end, text: curText.trim()});
      curText = '';
      curStart = (j + 1 < words.length) ? words[j + 1].time / 1000 : end;
    }
  }

  if (curText.trim()) {
    chunks.push({
      start: curStart,
      end: (words[words.length - 1].time / 1000) + 1.2,
      text: curText.trim()
    });
  }

  idx = 0;
  show();
}

// Добавь эту функцию где-нибудь в <script> (лучше в начале)
function createHiddenWordsElement(text) {
  const container = document.getElementById('hidden-words');
  container.innerHTML = ''; // чистим

  // Разбиваем на слова, убираем знаки препинания
  const words = text
    .split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length > 0);

  words.forEach(word => {
    // Очищаем от пунктуации для проверки
    const clean = word.replace(/[^a-zA-Z0-9а-яА-ЯёЁ]/g, '');

    // Условие «всегда видно»
    const shouldBeVisible =
      /[A-ZА-ЯЁ0-9]/.test(clean) ||      // есть заглавная или цифра
      clean.length === 0;                 // на всякий случай пустые не прячем

    if (shouldBeVisible) {
      // Просто текст
      const span = document.createElement('span');
      span.textContent = word + ' ';
      span.className = 'always-visible';
      container.appendChild(span);
    } else {
      // Скрытая кнопка-слово
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'secret-word';

      // ★ для каждой буквы (можно заменить на • или ••• и т.д.)
      btn.textContent = '★'.repeat(clean.length);
      btn.dataset.real = word; // сохраняем настоящее слово

      btn.onclick = () => {
        if (!btn.classList.contains('revealed')) {
          btn.textContent = word;
          btn.classList.add('revealed');
        }
      };

      container.appendChild(btn);
      // пробел после слова
      container.appendChild(document.createTextNode(' '));
    }
  });
}

function show() {
  if (!chunks.length) return;
  const c = chunks[idx];
  document.getElementById('text').textContent = c.text;
  createHiddenWordsElement(c.text);
  document.getElementById('info').textContent = 
    `${idx+1}/${chunks.length} [${c.start.toFixed(1)}–${c.end.toFixed(1)}]`;
}

function playNow() {
  if (!chunks.length || !player) return;
  const c = chunks[idx];
  player.pauseVideo();
  player.seekTo(c.start, true);
  setTimeout(() => {
    player.playVideo();
    clearInterval(tmr);
    tmr = setInterval(() => {
      if (player.getCurrentTime() >= c.end - 0.1) {
        player.pauseVideo();
        clearInterval(tmr);
      }
    }, 60);
  }, 400);
}

function next() {
  if (idx + 1 < chunks.length) { idx++; show(); playNow(); } 
}
  
function prev() { 
  if (idx > 0) { idx--; show(); playNow(); } 
}
</script>
  
</body>
</html>
